<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="سوق الحسكة - موقع وائل لبيع الأغراض الجديدة والمستعملة في الحسكة">
<title>سوق الحسكة | موقع وائل</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Tahoma,Arial,sans-serif;
  background:#f4f6f8;
  color:#17202a;
  line-height:1.7;
}

header{
  background:linear-gradient(135deg,#071a33,#123b68);
  color:white;
  padding:18px 5%;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 3px 15px rgba(0,0,0,.18);
}

.nav{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:25px;
  font-weight:bold;
}

.logo small{
  display:block;
  font-size:12px;
  color:#e8c76b;
  font-weight:normal;
}

nav{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

nav button{
  border:0;
  background:transparent;
  color:white;
  padding:9px 13px;
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
}

nav button:hover{
  background:rgba(255,255,255,.12);
}

.hero{
  background:linear-gradient(135deg,#0a2342,#155b91);
  color:white;
  text-align:center;
  padding:55px 20px;
}

.hero h1{
  font-size:38px;
  margin-bottom:10px;
}

.hero p{
  font-size:18px;
  max-width:700px;
  margin:auto;
}

.domain{
  display:inline-block;
  margin-top:18px;
  color:#f0d36b;
  font-weight:bold;
  font-size:17px;
}

.container{
  max-width:1200px;
  margin:30px auto;
  padding:0 18px;
}

.search-box{
  background:white;
  padding:20px;
  border-radius:16px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:-45px;
  position:relative;
}

.search-box input,
.search-box select{
  flex:1;
  min-width:180px;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
}

.btn{
  border:0;
  border-radius:10px;
  padding:13px 20px;
  cursor:pointer;
  font-size:15px;
  font-weight:bold;
  background:#123b68;
  color:white;
}

.btn:hover{
  opacity:.9;
}

.btn.gold{
  background:#d5a928;
  color:#101820;
}

.btn.green{
  background:#198754;
}

.section-title{
  margin:35px 0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.section-title h2{
  font-size:25px;
}

.categories{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:12px;
}

.category{
  background:white;
  border:1px solid #e3e6e8;
  border-radius:13px;
  padding:18px 10px;
  text-align:center;
  cursor:pointer;
  transition:.2s;
}

.category:hover{
  transform:translateY(-3px);
  box-shadow:0 7px 18px rgba(0,0,0,.1);
}

.category .icon{
  font-size:32px;
  display:block;
  margin-bottom:5px;
}

.listings{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:18px;
}

.card{
  background:white;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 4px 16px rgba(0,0,0,.08);
  border:1px solid #e8eaec;
}

.card-img{
  height:175px;
  background:linear-gradient(135deg,#dfe7ef,#f8fafc);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:60px;
  color:#526579;
}

.card-body{
  padding:17px;
}

.card h3{
  font-size:18px;
  margin-bottom:7px;
}

.price{
  color:#0d6b3f;
  font-size:20px;
  font-weight:bold;
  margin:7px 0;
}

.meta{
  color:#707981;
  font-size:13px;
  margin-bottom:12px;
}

.card-actions{
  display:flex;
  gap:7px;
}

.card-actions button{
  flex:1;
}

.empty{
  background:white;
  padding:35px;
  border-radius:15px;
  text-align:center;
  color:#777;
}

.info{
  background:#fff;
  padding:25px;
  border-radius:15px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}

footer{
  margin-top:50px;
  background:#071a33;
  color:white;
  text-align:center;
  padding:35px 20px;
}

footer strong{
  color:#e5c35b;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:2000;
  padding:20px;
  overflow:auto;
}

.modal-box{
  background:white;
  max-width:650px;
  margin:40px auto;
  border-radius:18px;
  padding:25px;
  position:relative;
}

.close{
  position:absolute;
  left:18px;
  top:12px;
  font-size:27px;
  cursor:pointer;
  color:#777;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  margin-bottom:6px;
  font-weight:bold;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:9px;
  font-family:inherit;
  font-size:15px;
}

.form-group textarea{
  min-height:110px;
  resize:vertical;
}

.admin-box{
  background:#f5f7fa;
  padding:18px;
  border-radius:12px;
  margin-top:15px;
}

.admin-item{
  background:white;
  padding:13px;
  border-radius:10px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.notice{
  background:#fff8df;
  border-right:5px solid #d5a928;
  padding:14px;
  border-radius:8px;
  margin-bottom:18px;
}

@media(max-width:650px){
  .hero h1{
    font-size:28px;
  }

  .nav{
    flex-direction:column;
  }

  nav{
    justify-content:center;
  }

  .search-box{
    margin-top:-25px;
  }

  .search-box input,
  .search-box select{
    width:100%;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">
    <div class="logo">
      🛒 سوق الحسكة
      <small>موقع وائل للبيع والشراء</small>
    </div>

    <nav>
      <button onclick="scrollToSection('home')">الرئيسية</button>
      <button onclick="scrollToSection('listingsSection')">الإعلانات</button>
      <button onclick="openAddModal()">➕ أضف إعلان</button>
      <button onclick="openAdmin()">🔐 إدارة الموقع</button>
    </nav>
  </div>
</header>

<section class="hero" id="home">
  <h1>سوق الحسكة</h1>
  <p>
    موقع وائل لبيع الأغراض الجديدة والمستعملة في الحسكة
  </p>
  <span class="domain">www.wael09.com</span>
</section>

<main class="container">

  <div class="search-box">
    <input
      type="search"
      id="searchInput"
      placeholder="ابحث عن سيارة، هاتف، أثاث، عقار..."
      oninput
